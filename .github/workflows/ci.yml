name: CI

on:
  pull_request:
  push:
    # feat/** y fix/**: evidencia de CI antes del PASS, sin abrir el PR (un PR corre CI dos veces).
    branches: [staging, main, 'feat/**', 'fix/**']

jobs:
  # Suite de los hooks del pipeline (C2 de cuenta-agente). Check obligatorio en staging y main.
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: awk -W version 2>/dev/null | head -1 || true
      - run: bash scripts/test-hooks.sh
      # En ubuntu-latest awk es gawk; esta corrida prueba el analizador con mawk (lo instala si falta).
      - name: test-hooks con mawk
        run: |
          command -v mawk >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq mawk; }
          mkdir -p /tmp/con-mawk && ln -sf "$(command -v mawk)" /tmp/con-mawk/awk
          /tmp/con-mawk/awk -W version 2>&1 | head -1
          PATH="/tmp/con-mawk:$PATH" bash scripts/test-hooks.sh

  detect:
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.d.outputs.node }}
      python: ${{ steps.d.outputs.python }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        run: |
          [ -f package.json ] && echo "node=true" >> "$GITHUB_OUTPUT" || echo "node=false" >> "$GITHUB_OUTPUT"
          [ -f pyproject.toml ] && echo "python=true" >> "$GITHUB_OUTPUT" || echo "python=false" >> "$GITHUB_OUTPUT"

  node:
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm test

  python:
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      # Requiere pytest-cov en las dependencias de desarrollo. Ajusta el umbral por proyecto.
      - run: uv run pytest -q --cov --cov-fail-under=70

  # Secretos en todo el historial con gitleaks (licencia MIT), sin gitleaks-action: la action pide
  # licencia en repos de organización (A2). Versión y SHA-256 fijos, del checksums.txt de la release.
  # El nombre del job (secrets) es el check que exigen los rulesets de main y staging: no lo cambies.
  # -m escanea también lo que agrega un commit de merge (una resolución de conflicto); sin eso git log -p
  # no lo muestra. --ignore-gitleaks-allow: un comentario gitleaks:allow no apaga hallazgos. gitleaks
  # sale con 0 si git log falla (escribe ERR) o si no escanea ningún commit: eso se trata como falla.
  # .gitleaksignore y .gitleaks.toml apagan hallazgos y son rutas de gobierno.
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (binario con SHA-256 fijo)
        run: |
          set -euo pipefail
          v=8.30.1
          t="gitleaks_${v}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${v}/${t}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${t}" | sha256sum -c -
          tar -xzf "$t" gitleaks
          ./gitleaks git --redact --no-banner --no-color --verbose --ignore-gitleaks-allow \
            --log-opts="--all --full-history -m" . 2>&1 | tee "$RUNNER_TEMP/gitleaks.log"
          if grep -Eq ' ERR |INF 0 commits scanned' "$RUNNER_TEMP/gitleaks.log"; then
            echo "::error::gitleaks no pudo escanear el historial (ver ERR arriba)"
            exit 1
          fi
