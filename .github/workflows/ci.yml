name: CI

on:
  pull_request:
  push:
    # feat/** y fix/**: evidencia de CI antes del PASS, sin abrir el PR (un PR corre CI dos veces).
    branches: [staging, main, 'feat/**', 'fix/**']

jobs:
  # Suite de los hooks del pipeline (C2 de cuenta-agente). Check obligatorio en staging y main.
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: awk -W version 2>/dev/null | head -1 || true
      - run: bash scripts/test-hooks.sh
      # En ubuntu-latest awk es gawk; esta corrida prueba el analizador con mawk (lo instala si falta).
      - name: test-hooks con mawk
        run: |
          command -v mawk >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq mawk; }
          mkdir -p /tmp/con-mawk && ln -sf "$(command -v mawk)" /tmp/con-mawk/awk
          /tmp/con-mawk/awk -W version 2>&1 | head -1
          PATH="/tmp/con-mawk:$PATH" bash scripts/test-hooks.sh

  detect:
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.d.outputs.node }}
      python: ${{ steps.d.outputs.python }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        run: |
          [ -f package.json ] && echo "node=true" >> "$GITHUB_OUTPUT" || echo "node=false" >> "$GITHUB_OUTPUT"
          [ -f pyproject.toml ] && echo "python=true" >> "$GITHUB_OUTPUT" || echo "python=false" >> "$GITHUB_OUTPUT"

  node:
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm test

  python:
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      # Requiere pytest-cov en las dependencias de desarrollo. Ajusta el umbral por proyecto.
      - run: uv run pytest -q --cov --cov-fail-under=70

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
